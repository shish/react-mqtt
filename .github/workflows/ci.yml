name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npx biome format --check .

      - name: Lint
        run: npx biome lint .

      - name: Check
        run: npx biome check .

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
